<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Attendance & Face Recognition</title>
  <link rel="stylesheet" href="style.css">
  <!-- Libraries for QR & Face Recognition -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
</head>
<body>

  <header>
    <h1>School Attendance Gateway</h1>
    <p>QR Scanner & Face Recognition Auto-Sorting System</p>
  </header>

  <main class="container">
    <!-- Scanner Card -->
    <section class="scanner-card">
      <div class="mode-toggle">
        <button id="btnQR" onclick="setMode('QR')" class="active-btn">📷 QR Scan</button>
        <button id="btnFace" onclick="setMode('FACE')">👤 Face Scan</button>
      </div>

      <div id="reader"></div>
      <video id="video" autoplay muted style="display:none; width:100%; border-radius:8px;"></video>
      
      <div id="statusMessage" class="status-box">Loading system...</div>
    </section>
    
      <!-- QR Generator Card -->
    <section class="scanner-card" style="margin-top: 15px;">
      <h2>Generate Student ID QR</h2>
      <select id="studentSelect" style="width:100%; padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid #ccc;"></select>
      <button onclick="generateQRCode()" style="width:100%; padding:10px; background:#28a745; color:white; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">Generate QR Code</button>
      <div style="text-align:center; margin-top:15px;">
        <img id="qrImage" src="" style="display:none; margin: 0 auto; border: 1px solid #ddd; padding: 5px; border-radius: 5px; width: 180px; height: 180px;" alt="QR Code">
      </div>
    </section>

    <!-- Section Attendance Logs -->
    <section class="dashboard-card">
      <h2>Live Attendance Logs</h2>
      
      <div class="sections-container">
        <div class="section-box">
          <h3>Grade 7 - Section 1</h3>
          <table>
            <thead><tr><th>Name</th><th>Time</th><th>Method</th></tr></thead>
            <tbody id="logs-section-1"></tbody>
          </table>
        </div>

        <div class="section-box">
          <h3>Grade 7 - Section 2</h3>
          <table>
            <thead><tr><th>Name</th><th>Time</th><th>Method</th></tr></thead>
            <tbody id="logs-section-2"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
